[build-system]
# hatchling 1.27 is the last release that supports building on Python 3.9
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "notificationhubs-rest-python"
version = "2.0.0"
description = "A Python library for sending notifications using Azure Notification Hubs REST API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Panevo Services Ltd.", email = "info@panevo.com" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/panevo/notificationhubs-rest-python"
Changelog = "https://github.com/panevo/notificationhubs-rest-python/blob/main/CHANGELOGS.md"

[tool.hatch.build.targets.wheel]
packages = ["src/notificationhubs_rest_python"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CHANGELOGS.md",
    "/SECURITY.md",
]

[dependency-groups]
test = [
    "coverage[toml]>=7.10",
    "pytest>=8",
    "responses>=0.25",
]
lint = [
    "mypy>=1.18",
    "ruff>=0.14",
    "types-requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
# Any warning fails the tests
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["notificationhubs_rest_python"]

[tool.coverage.paths]
source = [
    "src/notificationhubs_rest_python",
    "*/site-packages/notificationhubs_rest_python",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "PT"]

[tool.mypy]
files = ["src"]
strict = true
